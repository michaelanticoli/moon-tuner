name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Increase Node memory for large builds/tests
      NODE_OPTIONS: "--max-old-space-size=4096"

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies (try strict, fallback to install)
        run: |
          set -euo pipefail
          echo "Attempting npm ci --legacy-peer-deps"
          if npm ci --legacy-peer-deps --no-audit --no-fund; then
            echo "npm ci succeeded"
          else
            echo "npm ci failed, falling back to npm install --legacy-peer-deps"
            npm install --legacy-peer-deps --no-audit --no-fund
          fi

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
